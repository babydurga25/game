cat <<'EOF' > index.html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match - Brain Challenge</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  color: white;
  background: linear-gradient(135deg, #17113d, #482477, #173e72);
  padding: 25px 15px;
}

.container {
  max-width: 700px;
  margin: auto;
  text-align: center;
}

h1 {
  font-size: clamp(30px, 6vw, 44px);
  margin-bottom: 8px;
}

.subtitle {
  color: #ddd5ff;
  margin-bottom: 25px;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 22px;
}

.stat {
  padding: 15px 5px;
  border: 1px solid #ffffff30;
  border-radius: 15px;
  background: #ffffff12;
}

.stat strong {
  display: block;
  font-size: 25px;
  margin-top: 8px;
  color: #ffe27a;
}

.game {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.card {
  aspect-ratio: 1;
  border: 2px solid #ffffff25;
  border-radius: 15px;
  background: linear-gradient(145deg, #ff70bc, #8b5cf6);
  font-size: clamp(25px, 6vw, 43px);
  cursor: pointer;
  transition: transform 0.2s, background 0.2s;
  box-shadow: 0 5px 12px #0003;
}

.card:hover {
  transform: translateY(-3px);
}

.card.flipped, .card.matched {
  background: #ffffff;
  border-color: #ffe27a;
}

.card.matched {
  background: #c8ffdb;
  cursor: default;
}

button.control {
  margin: 22px 5px 0;
  padding: 13px 25px;
  border: none;
  border-radius: 25px;
  font-size: 16px;
  font-weight: bold;
  background: #ffe27a;
  color: #241747;
  cursor: pointer;
}

#message {
  margin-top: 20px;
  font-size: 20px;
  font-weight: bold;
  color: #ffe27a;
}

@media (max-width: 420px) {
  .game { gap: 7px; }
  .card { border-radius: 10px; }
}
</style>
</head>
<body>
<div class="container">
  <h1>🧠 Memory Match</h1>
  <p class="subtitle">Flip the cards. Find the pairs. Train your brain!</p>

  <div class="stats">
    <div class="stat">Moves<strong id="moves">0</strong></div>
    <div class="stat">Matches<strong id="matches">0 / 8</strong></div>
    <div class="stat">Time<strong id="time">0s</strong></div>
  </div>

  <div class="game" id="game"></div>

  <button class="control" onclick="startGame()">🔄 Restart Game</button>
  <div id="message">Ready? Find all 8 pairs! 🎯</div>
</div>

<script>
const emojis = [
  "🐼", "🦊", "🐸", "🦄",
  "🐼", "🦊", "🐸", "🦄",
  "🍕", "🚀", "🍩", "🎸",
  "🍕", "🚀", "🍩", "🎸"
];

let firstCard = null;
let secondCard = null;
let locked = false;
let moves = 0;
let matches = 0;
let seconds = 0;
let timer = null;
let started = false;

function startGame() {
  clearInterval(timer);
  firstCard = null;
  secondCard = null;
  locked = false;
  moves = 0;
  matches = 0;
  seconds = 0;
  started = false;

  document.getElementById("moves").textContent = moves;
  document.getElementById("matches").textContent = "0 / 8";
  document.getElementById("time").textContent = "0s";
  document.getElementById("message").textContent =
    "Ready? Find all 8 pairs! 🎯";

  const shuffled = [...emojis].sort(() => Math.random() - 0.5);
  const game = document.getElementById("game");
  game.innerHTML = "";

  shuffled.forEach((emoji, index) => {
    const card = document.createElement("button");
    card.className = "card";
    card.textContent = "?";
    card.setAttribute("aria-label", "Hidden card");
    card.dataset.emoji = emoji;
    card.dataset.index = index;
    card.addEventListener("click", () => flipCard(card));
    game.appendChild(card);
  });
}

function flipCard(card) {
  if (locked || card.classList.contains("flipped") ||
      card.classList.contains("matched")) return;

  if (!started) {
    started = true;
    timer = setInterval(() => {
      seconds++;
      document.getElementById("time").textContent = seconds + "s";
    }, 1000);
  }

  card.classList.add("flipped");
  card.textContent = card.dataset.emoji;
  card.setAttribute("aria-label", card.dataset.emoji);

  if (!firstCard) {
    firstCard = card;
    return;
  }

  secondCard = card;
  moves++;
  document.getElementById("moves").textContent = moves;

  if (firstCard.dataset.emoji === secondCard.dataset.emoji) {
    firstCard.classList.add("matched");
    secondCard.classList.add("matched");
    matches++;
    document.getElementById("matches").textContent = matches + " / 8";
    firstCard = null;
    secondCard = null;

    if (matches === 8) {
      clearInterval(timer);
      document.getElementById("message").textContent =
        "🏆 Amazing! You won in " + moves + " moves and " +
        seconds + " seconds!";
    }
  } else {
    locked = true;
    setTimeout(() => {
      firstCard.classList.remove("flipped");
      secondCard.classList.remove("flipped");
      firstCard.textContent = "?";
      secondCard.textContent = "?";
      firstCard.setAttribute("aria-label", "Hidden card");
      secondCard.setAttribute("aria-label", "Hidden card");
      firstCard = null;
      secondCard = null;
      locked = false;
    }, 800);
  }
}

startGame();
</script>
</body>
</html>
EOF
